services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/studypath.db}
      DATA_ROOT: /app/data
      QDRANT_LOCAL_PATH: /app/data/qdrant
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      INDEX_WORKER_ENABLED: "true"
    volumes:
      - studypath_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  studypath_data:
